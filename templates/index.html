<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Campus Map Search</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        "Tahoma",
        sans-serif;

    background: #eef6f2;

    color: #222;
}


/* ======================================
   HEADER
====================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #087f5b,
            #0b7285
        );

    color: white;

    text-align: center;

    padding: 20px;
}


.header h1 {

    margin: 0;

    font-size: 28px;
}


.header p {

    margin: 8px 0 0;

    font-size: 15px;
}


/* ======================================
   CONTAINER
====================================== */

.container {

    width: 95%;

    max-width: 1300px;

    margin: 20px auto;
}


/* ======================================
   SEARCH
====================================== */

.search-box {

    background: white;

    padding: 18px;

    border-radius: 15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.12);

    margin-bottom: 20px;
}


.search-box label {

    display: block;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;
}


#searchInput {

    width: 100%;

    padding: 14px 16px;

    font-size: 18px;

    border: 2px solid #0b7285;

    border-radius: 10px;

    outline: none;
}


#searchInput:focus {

    border-color: #087f5b;
}


.hint {

    margin-top: 8px;

    color: #777;

    font-size: 14px;
}


/* ======================================
   RESULTS
====================================== */

#results {

    margin-top: 12px;
}


.result {

    background: #f7fffb;

    border: 1px solid #cde8dd;

    padding: 12px;

    margin-bottom: 8px;

    border-radius: 10px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}


.result:hover {

    background: #e1f5eb;

    border-color: #087f5b;
}


.result-name {

    font-weight: bold;

    line-height: 1.4;
}


.number {

    background: #087f5b;

    color: white;

    padding: 7px 13px;

    border-radius: 20px;

    font-weight: bold;

    white-space: nowrap;
}


/* ======================================
   MAP
====================================== */

.map-card {

    background: white;

    padding: 15px;

    border-radius: 15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.12);
}


.map-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 12px;
}


.map-container {

    position: relative;

    width: 100%;

    overflow: hidden;

    border-radius: 10px;

    background: #eee;
}


.map-container img {

    display: block;

    width: 100%;

    height: auto;
}


/* ======================================
   RED CIRCLE
====================================== */

.pin {

    position: absolute;

    width: 55px;

    height: 55px;

    transform:
        translate(-50%, -50%);

    border:

        6px solid red;

    border-radius: 50%;

    background:
        rgba(255,0,0,0.12);

    box-shadow:

        0 0 0 4px
        rgba(255,0,0,0.30),

        0 0 22px
        rgba(255,0,0,0.80);

    z-index: 100;

    pointer-events: none;

    animation:
        pulse 1.2s infinite;
}


/* ======================================
   NUMBER ON CIRCLE
====================================== */

.pin-number {

    position: absolute;

    left: 50%;

    top: -42px;

    transform:
        translateX(-50%);

    background: red;

    color: white;

    font-size: 19px;

    font-weight: bold;

    padding: 5px 11px;

    border-radius: 20px;

    white-space: nowrap;

    border: 3px solid white;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.35);
}


/* ======================================
   ANIMATION
====================================== */

@keyframes pulse {

    0% {

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.12);
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);
    }

}


/* ======================================
   NO RESULT
====================================== */

.no-result {

    text-align: center;

    padding: 15px;

    color: #777;
}


/* ======================================
   MOBILE
====================================== */

@media (max-width: 600px) {

    .header h1 {

        font-size: 21px;
    }


    .container {

        width: 98%;
    }


    .pin {

        width: 42px;

        height: 42px;

        border-width: 4px;
    }


    .pin-number {

        font-size: 15px;

        top: -35px;
    }

}

</style>

</head>


<body>


<!-- ======================================
     HEADER
====================================== -->

<div class="header">

    <h1>
        ระบบค้นหาสถานที่ภายในมหาวิทยาลัย
    </h1>

    <p>
        ค้นหาสถานที่ แล้วแสดงตำแหน่งบนแผนที่
    </p>

</div>


<div class="container">


<!-- ======================================
     SEARCH
====================================== -->

<div class="search-box">

    <label>
        🔎 ค้นหาสถานที่
    </label>


    <input
        type="text"
        id="searchInput"
        placeholder="เช่น คณะวิศวกรรมศาสตร์, โรงอาหาร, สนามกีฬา, 91..."
        autocomplete="off"
    >


    <div class="hint">

        สามารถค้นหาด้วย
        <b>ชื่อสถานที่</b>
        หรือ
        <b>เลขอาคาร</b>

    </div>


    <div id="results"></div>

</div>



<!-- ======================================
     MAP
====================================== -->

<div class="map-card">

    <div class="map-title">

        📍 ตำแหน่งบนแผนที่

    </div>


    <div
        class="map-container"
        id="mapContainer"
    >

        <img
            src="{{ url_for('static', filename='map.jpg') }}"
            id="mapImage"
            alt="แผนผังมหาวิทยาลัย"
        >

    </div>

</div>


</div>



<script>


const searchInput =
    document.getElementById(
        "searchInput"
    );


const results =
    document.getElementById(
        "results"
    );


const mapContainer =
    document.getElementById(
        "mapContainer"
    );



/* ======================================
   ลบวงกลมเก่า
====================================== */

function clearPins() {

    const oldPins =
        document.querySelectorAll(
            ".pin"
        );

    oldPins.forEach(pin => {

        pin.remove();

    });

}



/* ======================================
   สร้างวงกลม
====================================== */

function createPin(place) {

    const pin =
        document.createElement(
            "div"
        );


    pin.className =
        "pin";


    pin.style.left =
        place.x + "%";


    pin.style.top =
        place.y + "%";


    const number =
        document.createElement(
            "div"
        );


    number.className =
        "pin-number";


    number.textContent =
        place.number;


    pin.appendChild(number);


    mapContainer.appendChild(pin);

}



/* ======================================
   แสดงวงกลมทั้งหมด
====================================== */

function showPins(data) {

    clearPins();


    data.forEach(place => {

        createPin(place);

    });


    /*
     * ถ้ามีผลลัพธ์ ให้เลื่อนไปที่แผนที่
     */

    if (data.length > 0) {

        setTimeout(() => {

            document
                .querySelector(
                    ".map-card"
                )
                .scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

        }, 100);

    }

}



/* ======================================
   แสดงผลการค้นหา
====================================== */

function showResults(data) {

    results.innerHTML = "";


    if (data.length === 0) {

        results.innerHTML = `

            <div class="no-result">

                ❌ ไม่พบสถานที่

            </div>

        `;

        clearPins();

        return;

    }


    data.forEach(place => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "result";


        item.innerHTML = `

            <div class="result-name">

                ${place.name}

            </div>


            <div class="number">

                เลข ${place.number}

            </div>

        `;


        /*
         * เมื่อคลิกผลการค้นหา
         */

        item.addEventListener(
            "click",
            function() {

                searchInput.value =
                    place.name;


                /*
                 * แสดงเฉพาะจุดที่เลือก
                 */

                showPins([
                    place
                ]);

            }
        );


        results.appendChild(item);

    });


    /*
     * ถ้ามีผลลัพธ์เดียว
     * วงกลมให้อัตโนมัติ
     */

    if (data.length === 1) {

        showPins(data);

    }

}



/* ======================================
   SEARCH API
====================================== */

let timer = null;


searchInput.addEventListener(
    "input",
    function() {

        clearTimeout(timer);


        const query =
            this.value.trim();


        if (!query) {

            results.innerHTML = "";

            clearPins();

            return;

        }


        timer =
            setTimeout(() => {

                fetch(
                    "/api/search?q=" +
                    encodeURIComponent(
                        query
                    )
                )

                .then(response =>
                    response.json()
                )

                .then(data => {

                    showResults(data);

                })

                .catch(error => {

                    console.error(error);

                    results.innerHTML = `

                        <div class="no-result">

                            ❌ เกิดข้อผิดพลาด

                        </div>

                    `;

                });

            }, 200);

    }
);


</script>


</body>

</html>
